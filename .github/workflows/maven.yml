# Build Once, Fan Out, Then Gate CI workflow for Babble:
#   0. changes       (1 runner)  : checks whether all changed files live under docs/ or root README.md; if so, skips build/tests/batest
#   1. build         (1 runner)  : compiles src/main + src/test and packages jars once, uploads target/
#   2. unit-tests    (4 runners) : downloads target/ and runs src/test/java (excluding batest runners), one runner per mode : interpret, -O1, -O0, -O2
#   3. batest        (6 runners) : downloads target/, runs -Pbatest 4-mode JVM specs (interpret, -O1, -O0, -O2 with JaCoCo)
#                                  and Wasm 3.0 parity for -Dbatest.shard=<N>/6, and uploads per-shard JaCoCo .exec + outcomes
#   4. batest-report (1 runner)  : merges JaCoCo .exec and outcomes-*.jsonl across all 6 shards and enforces 4-way parity + >= 80% 6-scope coverage gate
#   5. ci            (1 runner)  : single required status-check gate aggregating changes, build, unit-tests, batest, and batest-report

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check changed paths
      id: filter
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        BASE=""
        if [ "$EVENT_NAME" = "pull_request" ]; then
          BASE="$PR_BASE_SHA"
        elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          BASE="$PUSH_BEFORE_SHA"
        fi
        if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
          echo "Base commit unavailable; running full CI."
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        CHANGED=$(git diff --name-only "$BASE" HEAD)
        if [ -z "$CHANGED" ]; then
          echo "No changed files detected; running full CI."
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        DOCS_ONLY=true
        while IFS= read -r path; do
          [ -z "$path" ] && continue
          case "$path" in
            docs/*|README.md) ;;
            *) DOCS_ONLY=false; break ;;
          esac
        done <<< "$CHANGED"
        echo "Changed files:"
        echo "$CHANGED"
        echo "docs_only=$DOCS_ONLY"
        echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Compile and package (skip tests)
      run: mvn -B package -DskipTests --file pom.xml
    - name: Upload compiled target
      uses: actions/upload-artifact@v7
      with:
        name: maven-target
        path: target/
        retention-days: 1

  unit-tests:
    name: Unit Tests (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: interpret
            execution: default-test
            profile: ''
          - mode: O1
            execution: compiled-tests
            profile: ''
          - mode: O0
            execution: compiled-tests-O0
            profile: ''
          - mode: O2
            execution: compiled-tests-O2
            profile: '-PO2'
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Node.js 22 (for WebAssembly 3.0 tests)
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Download compiled target
      uses: actions/download-artifact@v8
      with:
        name: maven-target
        path: target
    - name: Run Java unit tests (${{ matrix.mode }})
      run: |
        mvn -B ${{ matrix.profile }} --file pom.xml \
          org.apache.maven.plugins:maven-surefire-plugin:test@${{ matrix.execution }} \
          -Dtest='!BatestTestCase,!WasmBatestTestCase'

  batest:
    name: Batest (${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Node.js 22 (for WebAssembly 3.0 tests)
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Download compiled target
      uses: actions/download-artifact@v8
      with:
        name: maven-target
        path: target
    - name: Run 4-mode JVM batest shard ${{ matrix.shard }}/6 with JaCoCo
      run: |
        mvn -B -Pbatest --file pom.xml \
          org.jacoco:jacoco-maven-plugin:prepare-agent@prepare-agent-interpret \
          org.jacoco:jacoco-maven-plugin:prepare-agent@prepare-agent-compile \
          org.jacoco:jacoco-maven-plugin:prepare-agent@prepare-agent-compile-O0 \
          org.jacoco:jacoco-maven-plugin:prepare-agent@prepare-agent-compile-O2 \
          org.apache.maven.plugins:maven-surefire-plugin:test@default-test \
          org.apache.maven.plugins:maven-surefire-plugin:test@compiled-tests \
          org.apache.maven.plugins:maven-surefire-plugin:test@compiled-tests-O0 \
          org.apache.maven.plugins:maven-surefire-plugin:test@compiled-tests-O2 \
          -Dbatest.shard="${{ matrix.shard }}/6"
    - name: Run WebAssembly 3.0 batest parity shard ${{ matrix.shard }}/6
      run: |
        mvn -B --file pom.xml \
          org.apache.maven.plugins:maven-surefire-plugin:test@compiled-tests \
          -Dtest=WasmBatestTestCase \
          -Dbatest.shard="${{ matrix.shard }}/6"
    - name: Upload shard coverage and outcomes
      uses: actions/upload-artifact@v7
      with:
        name: batest-cov-${{ matrix.shard }}
        path: |
          target/jacoco-interpret.exec
          target/jacoco-compile.exec
          target/jacoco-compile-O0.exec
          target/jacoco-compile-O2.exec
          target/batest-report/outcomes-*.jsonl
        retention-days: 1

  batest-report:
    name: Batest Coverage & Parity Gate
    needs: [build, batest]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Download compiled target
      uses: actions/download-artifact@v8
      with:
        name: maven-target
        path: target
    - name: Download shard coverage and outcomes
      uses: actions/download-artifact@v8
      with:
        pattern: batest-cov-*
        path: target/batest-shards
        merge-multiple: false
    - name: Merge outcomes and JaCoCo coverage across shards
      run: |
        set -euo pipefail
        mkdir -p target/batest-report
        for mode in interpret compile compile-O0 compile-O2; do
          cat target/batest-shards/batest-cov-*/batest-report/outcomes-${mode}.jsonl \
            > target/batest-report/outcomes-${mode}.jsonl
        done
        mvn -B -Pbatest --file pom.xml \
          org.jacoco:jacoco-maven-plugin:merge@merge-interpret \
          org.jacoco:jacoco-maven-plugin:merge@merge-compile \
          org.jacoco:jacoco-maven-plugin:merge@merge-compile-O0 \
          org.jacoco:jacoco-maven-plugin:merge@merge-compile-O2 \
          org.jacoco:jacoco-maven-plugin:report@report-interpret \
          org.jacoco:jacoco-maven-plugin:report@report-compile \
          org.jacoco:jacoco-maven-plugin:report@report-opt \
          org.jacoco:jacoco-maven-plugin:report@report-compile-O0 \
          org.jacoco:jacoco-maven-plugin:report@report-opt-O2 \
          org.codehaus.mojo:exec-maven-plugin:java@batest-report

  ci:
    name: CI Gate
    needs: [changes, build, unit-tests, batest, batest-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check upstream jobs
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        BUILD_RESULT: ${{ needs.build.result }}
        UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
        BATEST_RESULT: ${{ needs.batest.result }}
        BATEST_REPORT_RESULT: ${{ needs.batest-report.result }}
      run: |
        echo "changes:       $CHANGES_RESULT (docs_only=$DOCS_ONLY)"
        echo "build:         $BUILD_RESULT"
        echo "unit-tests:    $UNIT_TESTS_RESULT"
        echo "batest:        $BATEST_RESULT"
        echo "batest-report: $BATEST_REPORT_RESULT"
        if [ "$CHANGES_RESULT" != "success" ]; then
          echo "::error::Change detection failed."
          exit 1
        fi
        if [ "$DOCS_ONLY" = "true" ]; then
          echo "Docs-only change detected — skipping build, unit tests, and batest."
          exit 0
        fi
        if [ "$BUILD_RESULT" != "success" ] || [ "$UNIT_TESTS_RESULT" != "success" ] || [ "$BATEST_RESULT" != "success" ] || [ "$BATEST_REPORT_RESULT" != "success" ]; then
          echo "::error::One or more CI jobs failed."
          exit 1
        fi
