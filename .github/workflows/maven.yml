# Build Once, Fan Out, Then Gate CI workflow for Babble:
#   1. build      (1 runner)  : compiles src/main + src/test and packages jars once, uploads target/
#   2. unit-tests (1 runner)  : downloads target/ and runs src/test/java (excluding batest runners) across interpret, -O1, -O0
#   3. batest     (6 runners) : downloads target/ and runs -Dbatest.shard=<N>/6 across interpret, -O1 (+ Wasm 3.0), -O0
#   4. ci         (1 runner)  : single required status-check gate aggregating build, unit-tests, and all batest shards

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Compile and package (skip tests)
      run: mvn -B package -DskipTests --file pom.xml
    - name: Upload compiled target
      uses: actions/upload-artifact@v4
      with:
        name: maven-target
        path: target/
        retention-days: 1

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Node.js 22 (for WebAssembly 3.0 tests)
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Download compiled target
      uses: actions/download-artifact@v4
      with:
        name: maven-target
        path: target
    - name: Run Java unit tests (interpret, -O1, -O0)
      run: |
        mvn -B --file pom.xml \
          surefire:test@default-test \
          surefire:test@compiled-tests \
          surefire:test@compiled-tests-O0 \
          -Dtest='!BatestTestCase,!WasmBatestTestCase'

  batest:
    name: Batest (${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Node.js 22 (for WebAssembly 3.0 tests)
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Download compiled target
      uses: actions/download-artifact@v4
      with:
        name: maven-target
        path: target
    - name: Run batest shard ${{ matrix.shard }}/6 (interpret, -O1 + Wasm, -O0)
      run: |
        mvn -B --file pom.xml \
          surefire:test@default-test \
          surefire:test@compiled-tests \
          surefire:test@compiled-tests-O0 \
          -Dtest=BatestTestCase,WasmBatestTestCase \
          -Dbatest.shard="${{ matrix.shard }}/6"

  ci:
    name: CI Gate
    needs: [build, unit-tests, batest]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check upstream jobs
      env:
        BUILD_RESULT: ${{ needs.build.result }}
        UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
        BATEST_RESULT: ${{ needs.batest.result }}
      run: |
        echo "build:      $BUILD_RESULT"
        echo "unit-tests: $UNIT_TESTS_RESULT"
        echo "batest:     $BATEST_RESULT"
        if [ "$BUILD_RESULT" != "success" ] || [ "$UNIT_TESTS_RESULT" != "success" ] || [ "$BATEST_RESULT" != "success" ]; then
          echo "::error::One or more CI jobs failed."
          exit 1
        fi
