<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Babble Unified Ray Tracer — WebAssembly 3.0 (WasmGC)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --panel: #171b24;
      --border: #2a3142;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 16px;
    }
    header {
      text-align: center;
      max-width: 760px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }
    input[type="number"], select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    input[type="number"] {
      width: 68px;
    }
    button {
      padding: 6px 16px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #0b0e14;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    canvas {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #000;
      max-width: 100%;
      image-rendering: pixelated;
    }
    #status {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Babble Unified Ray Tracer — WebAssembly 3.0 (WasmGC)</h1>
    <p>
      Pure-Babble core and scenes compiled via <code>babblec -target wasm-js</code>
      streaming pixels into <code>&lt;canvas&gt;</code> through <code>io/wasm/canvas.ba</code>.
    </p>
  </header>

  <div class="controls">
    <label>
      Scene
      <select id="scene">
        <option value="cover" selected>Weekend Cover</option>
        <option value="three-spheres">Three Spheres</option>
        <option value="triceratops">Baby Triceratops</option>
        <option value="cornell-box">Cornell Box</option>
        <option value="sdf-cube">Sculpted SDF Cube</option>
      </select>
    </label>
    <label>Width <input id="width" type="number" value="320" min="32" max="1200" step="16" /></label>
    <label>Samples <input id="samples" type="number" value="8" min="1" max="100" /></label>
    <label>Depth <input id="depth" type="number" value="12" min="2" max="50" /></label>
    <label id="gridLabel">Grid <input id="grid" type="number" value="3" min="1" max="11" /></label>
    <button id="renderBtn">Render</button>
  </div>

  <canvas id="canvas" width="320" height="180"></canvas>
  <div id="status">Ready. Pick a scene and click Render to run the WasmGC ray tracer.</div>

  <script type="module">
    import { runBabble } from "./raytracer_wasm.mjs";

    const sceneSelect = document.getElementById("scene");
    const widthInput = document.getElementById("width");
    const samplesInput = document.getElementById("samples");
    const depthInput = document.getElementById("depth");
    const gridInput = document.getElementById("grid");
    const gridLabel = document.getElementById("gridLabel");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const renderBtn = document.getElementById("renderBtn");

    const PRESETS = {
      cover: { aspect: 16 / 9, width: 320, samples: 8, depth: 12, showGrid: true },
      "three-spheres": { aspect: 16 / 9, width: 320, samples: 12, depth: 12, showGrid: false },
      triceratops: { aspect: 1.0, width: 160, samples: 16, depth: 5, showGrid: false },
      "cornell-box": { aspect: 1.0, width: 300, samples: 32, depth: 10, showGrid: false },
      "sdf-cube": { aspect: 16 / 9, width: 320, samples: 12, depth: 10, showGrid: false },
    };

    function applyPreset() {
      const preset = PRESETS[sceneSelect.value] || PRESETS.cover;
      widthInput.value = String(preset.width);
      samplesInput.value = String(preset.samples);
      depthInput.value = String(preset.depth);
      gridLabel.style.display = preset.showGrid ? "flex" : "none";
    }

    sceneSelect.addEventListener("change", applyPreset);
    applyPreset();

    async function render() {
      const sceneName = sceneSelect.value;
      const preset = PRESETS[sceneName] || PRESETS.cover;
      const width = Math.max(16, parseInt(widthInput.value, 10) || preset.width);
      const height = Math.max(1, Math.floor(width / preset.aspect));
      const samples = Math.max(1, parseInt(samplesInput.value, 10) || preset.samples);
      const depth = Math.max(2, parseInt(depthInput.value, 10) || preset.depth);
      const grid = Math.max(1, parseInt(gridInput.value, 10) || 3);

      canvas.width = width;
      canvas.height = height;
      const imageData = ctx.createImageData(width, height);
      const data = imageData.data;

      renderBtn.disabled = true;
      statusEl.textContent = `Rendering ${sceneName} ${width}x${height} (${samples} spp, depth ${depth})...`;
      const t0 = performance.now();

      try {
        await runBabble({
          args: [sceneName, String(width), String(samples), String(depth), String(grid)],
          imports: {
            canvas: {
              setPixel(x, y, r, g, b) {
                const idx = (y * width + x) * 4;
                data[idx] = r;
                data[idx + 1] = g;
                data[idx + 2] = b;
                data[idx + 3] = 255;
              },
              present(row) {
                if ((row & 7) === 0 || row === height - 1) {
                  ctx.putImageData(imageData, 0, 0);
                }
              },
            },
          },
        });
        ctx.putImageData(imageData, 0, 0);
        const ms = (performance.now() - t0).toFixed(1);
        statusEl.textContent = `Rendered ${sceneName} ${width}x${height} (${samples} spp) in ${ms} ms.`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message || err}`;
        console.error(err);
      } finally {
        renderBtn.disabled = false;
      }
    }

    renderBtn.addEventListener("click", render);
  </script>
</body>
</html>
