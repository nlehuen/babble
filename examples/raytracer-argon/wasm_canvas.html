<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Babble Argon Ray Tracer — WebAssembly 3.0 (WasmGC)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --panel: #171b24;
      --border: #2a3142;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 16px;
    }
    header {
      text-align: center;
      max-width: 720px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }
    input[type="number"] {
      width: 68px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    button {
      padding: 6px 16px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #0b0e14;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    canvas {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #000;
      max-width: 100%;
      image-rendering: pixelated;
    }
    #status {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Babble Argon Ray Tracer — WebAssembly 3.0 (WasmGC)</h1>
    <p>
      15 pure-Babble modules compiled via <code>babblec -target wasm-js</code>
      streaming pixels into <code>&lt;canvas&gt;</code> through typed
      <code>axiom wasm.canvas.*</code> host imports.
    </p>
  </header>

  <div class="controls">
    <label>Width <input id="width" type="number" value="320" min="32" max="1200" step="16" /></label>
    <label>Samples <input id="samples" type="number" value="8" min="1" max="100" /></label>
    <label>Depth <input id="depth" type="number" value="12" min="2" max="50" /></label>
    <label>Grid <input id="grid" type="number" value="3" min="1" max="11" /></label>
    <button id="renderBtn">Render</button>
  </div>

  <canvas id="scene" width="320" height="180"></canvas>
  <div id="status">Ready. Click Render to run the WasmGC ray tracer.</div>

  <script type="module">
    import { runBabble } from "./wasm_canvas.mjs";

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const renderBtn = document.getElementById("renderBtn");

    async function render() {
      const width = Math.max(16, parseInt(document.getElementById("width").value, 10) || 320);
      const height = Math.max(1, Math.floor(width / (16 / 9)));
      const samples = Math.max(1, parseInt(document.getElementById("samples").value, 10) || 8);
      const depth = Math.max(2, parseInt(document.getElementById("depth").value, 10) || 12);
      const grid = Math.max(1, parseInt(document.getElementById("grid").value, 10) || 3);

      canvas.width = width;
      canvas.height = height;
      const imageData = ctx.createImageData(width, height);
      const data = imageData.data;

      renderBtn.disabled = true;
      statusEl.textContent = `Rendering ${width}x${height} (${samples} spp, depth ${depth})...`;
      const t0 = performance.now();

      try {
        await runBabble({
          args: [String(width), String(samples), String(depth), String(grid)],
          imports: {
            canvas: {
              setPixel(x, y, r, g, b) {
                const idx = (y * width + x) * 4;
                data[idx] = r;
                data[idx + 1] = g;
                data[idx + 2] = b;
                data[idx + 3] = 255;
              },
              present(row) {
                if ((row & 7) === 0 || row === height - 1) {
                  ctx.putImageData(imageData, 0, 0);
                }
              },
            },
          },
        });
        ctx.putImageData(imageData, 0, 0);
        const ms = (performance.now() - t0).toFixed(1);
        statusEl.textContent = `Rendered ${width}x${height} (${samples} spp) in ${ms} ms.`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message || err}`;
        console.error(err);
      } finally {
        renderBtn.disabled = false;
      }
    }

    renderBtn.addEventListener("click", render);
  </script>
</body>
</html>
